name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - name: The tag is the version in package.json
        run: test "$GITHUB_REF_NAME" = "v$(node -p "require('./package.json').version")"
      - run: npm run check
      - run: npm test
      - run: npm run release
      - name: Publish the release files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files="dist/chainboot.tar.gz dist/chainboot.tar.gz.sha256 install.sh install.ps1"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            # the tag was moved to a newer commit: replace the files of the existing release
            gh release upload "$GITHUB_REF_NAME" $files --clobber
          else
            gh release create "$GITHUB_REF_NAME" $files --title "chainboot $GITHUB_REF_NAME" --generate-notes
          fi
